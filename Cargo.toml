[workspace]
members = ["crates/chvrn-core", "crates/chvrn-git", "crates/chvrn-tui", "crates/chvrn-integrations", "crates/chvrn-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"

[workspace.dependencies]
chvrn-core = { path = "crates/chvrn-core" }
chvrn-git = { path = "crates/chvrn-git" }
chvrn-tui = { path = "crates/chvrn-tui" }
chvrn-integrations = { path = "crates/chvrn-integrations" }
ropey = "1.6"
similar = { version = "2.7", features = ["inline", "unicode"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-json = "0.24"
ratatui = "0.29"
crossterm = "0.28"
unicode-segmentation = "1.12"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
tempfile = "3"
clap = { version = "4", features = ["derive"] }
notify = "8"

url = "2"
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
