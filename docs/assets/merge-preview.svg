<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Chvrn three-way merge capture placeholder</title>
  <desc id="description">A labelled layout sketch, not a product screenshot. Ours and Theirs flank an editable Merged result. Connected regions indicate changes of unequal height. Replace this image with the terminal capture described in the demo guide.</desc>
  <rect width="1200" height="360" rx="12" fill="#10141d"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="32" y="36" fill="#9aa8bd" font-size="13" letter-spacing="1.5">THREE-WAY MERGE</text>
    <text x="1168" y="36" fill="#9aa8bd" font-size="12" text-anchor="end">CAPTURE PLACEHOLDER · NOT A SCREENSHOT</text>
    <g fill="#161d29" stroke="#344157">
      <rect x="24" y="58" width="360" height="216" rx="4"/>
      <rect x="420" y="58" width="360" height="216" rx="4"/>
      <rect x="816" y="58" width="360" height="216" rx="4"/>
    </g>
    <g fill="#dfe7f3" font-size="16">
      <text x="44" y="87">Ours</text>
      <text x="440" y="87">Merged result</text>
      <text x="836" y="87">Theirs</text>
    </g>
    <g fill="#365348">
      <rect x="25" y="119" width="358" height="64"/>
      <path d="M384 119 L420 136 L420 168 L384 183 Z"/>
      <rect x="421" y="136" width="358" height="32"/>
    </g>
    <g fill="#564737">
      <rect x="421" y="211" width="358" height="26"/>
      <path d="M780 211 L816 192 L816 248 L780 237 Z"/>
      <rect x="817" y="192" width="358" height="56"/>
    </g>
    <g stroke="#a6b4c8" stroke-width="3" opacity="0.5">
      <path d="M45 137 H261 M45 153 H318 M45 169 H227 M441 152 H692 M837 208 H1061 M837 224 H1118 M837 240 H1037 M441 224 H664"/>
    </g>
    <text x="32" y="310" fill="#e0e7f1" font-size="17">Compare the sources. Edit the result. Confirm the write.</text>
    <text x="32" y="336" fill="#9aa8bd" font-size="13">Capture one resolved choice beside an unresolved conflict. See the linked demo guide.</text>
  </g>
</svg>
